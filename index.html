<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Колесо удачи</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Playfair+Display:ital,wght@0,600;0,700;0,900;1,700;1,900&display=swap" rel="stylesheet">
<style>
:root{
--bg:#12050A;
--bg2:#2B060F;
--gold:#F5C542;
--gold-deep:#C9971F;
--gold-soft:#FCE79B;
--violet:#C8102E;
--violet-deep:#6E0A18;
--cream:#FBF3E0;
--ink:#0B0616;
--font-disp:'Playfair Display',Georgia,serif;
--font-body:'Manrope','Segoe UI',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
font-family:var(--font-body);
color:var(--cream);
background:
radial-gradient(120% 90% at 50% -10%, rgba(200,16,46,.40), transparent 55%),
radial-gradient(90% 70% at 50% 120%, rgba(245,197,66,.12), transparent 60%),
linear-gradient(180deg,var(--bg),var(--bg2) 70%,#12040A);
min-height:100dvh;
display:flex;align-items:flex-start;justify-content:center;
overflow-x:hidden;overflow-y:auto;position:relative;
padding:calc(14px + env(safe-area-inset-top,0px)) 16px calc(34px + env(safe-area-inset-bottom,0px));
}
.spark{position:fixed;width:3px;height:3px;border-radius:50%;background:var(--gold-soft);
opacity:.0;pointer-events:none;filter:blur(.3px);animation:twinkle 4s infinite ease-in-out;}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.6)}50%{opacity:.85;transform:scale(1)}}
.stage{width:100%;max-width:520px;display:flex;flex-direction:column;align-items:center;
text-align:center;position:relative;z-index:2;}
.eyebrow{font-size:12px;letter-spacing:.32em;text-transform:uppercase;
color:var(--gold);font-weight:700;margin-bottom:10px;
display:inline-flex;align-items:center;gap:10px;}
.eyebrow::before,.eyebrow::after{content:"";width:26px;height:1px;
background:linear-gradient(90deg,transparent,var(--gold-deep));}
.eyebrow::after{background:linear-gradient(90deg,var(--gold-deep),transparent);}
h1{font-family:var(--font-disp);font-weight:900;line-height:1.04;
font-size:clamp(26px,6.4vw,40px);letter-spacing:-.01em;}
h1 .hl{color:var(--gold);font-style:italic;}
.sub{margin-top:8px;font-size:13.5px;line-height:1.45;color:#EAD6DA;max-width:360px;}
.wheel-wrap{position:relative;width:min(93vw,410px);height:min(93vw,410px);
margin:14px 0 2px;filter:drop-shadow(0 26px 52px rgba(0,0,0,.55));}
.pointer{position:absolute;top:-6px;left:50%;transform:translateX(-50%);z-index:6;
width:44px;height:52px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.6));}
.wheel{width:100%;height:100%;border-radius:50%;position:relative;
transition:transform 5.6s cubic-bezier(.14,.9,.18,1);will-change:transform;}
.rim{position:absolute;inset:0;border-radius:50%;z-index:5;pointer-events:none;}
.bulb{position:absolute;width:9px;height:9px;border-radius:50%;
background:radial-gradient(circle at 35% 30%,#fff,var(--gold) 55%,var(--gold-deep));
box-shadow:0 0 8px 1px rgba(245,197,66,.7);top:50%;left:50%;margin:-4.5px;
animation:bulbPulse 1.6s infinite ease-in-out;}
@keyframes bulbPulse{0%,100%{opacity:1}50%{opacity:.35}}
.hub{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:6;
width:23%;height:23%;border-radius:50%;
background:radial-gradient(circle at 38% 32%,#fff6d8,var(--gold) 42%,var(--gold-deep) 100%);
display:flex;align-items:center;justify-content:center;
box-shadow:0 0 0 5px #1c1030,0 6px 18px rgba(0,0,0,.5),inset 0 -4px 10px rgba(120,80,0,.4);}
.hub span{font-size:clamp(24px,7vw,36px);line-height:1;filter:drop-shadow(0 2px 3px rgba(90,50,0,.5));}
.btn{margin-top:16px;border:none;cursor:pointer;position:relative;
font-family:var(--font-body);font-weight:800;font-size:17px;letter-spacing:.04em;
text-transform:uppercase;color:#3a2600;padding:17px 46px;border-radius:100px;
background:linear-gradient(180deg,var(--gold-soft),var(--gold) 45%,var(--gold-deep));
box-shadow:0 10px 26px rgba(245,197,66,.35),inset 0 1px 0 rgba(255,255,255,.6);
transition:transform .15s ease,box-shadow .2s ease;
animation:breathe 2.6s infinite ease-in-out;}
@keyframes breathe{0%,100%{box-shadow:0 10px 26px rgba(245,197,66,.30),inset 0 1px 0 rgba(255,255,255,.6)}
50%{box-shadow:0 14px 40px rgba(245,197,66,.6),inset 0 1px 0 rgba(255,255,255,.6)}}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.4;cursor:not-allowed;animation:none;filter:grayscale(.3)}
.tries{margin-top:14px;font-size:13px;color:#B9A7D0;letter-spacing:.02em;}
.tries b{color:var(--gold);}
.overlay{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;
padding:20px;background:rgba(6,3,12,.78);backdrop-filter:blur(6px);}
.overlay.on{display:flex;animation:fade .3s ease;}
@keyframes fade{from{opacity:0}to{opacity:1}}
.card{width:100%;max-width:400px;border-radius:26px;padding:34px 28px 30px;text-align:center;
position:relative;overflow:hidden;
background:linear-gradient(180deg,rgba(64,14,24,.96),rgba(28,7,13,.98));
border:1px solid rgba(245,197,66,.35);
box-shadow:0 40px 80px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.06);
transform:translateY(16px) scale(.96);animation:pop .45s cubic-bezier(.2,1.3,.4,1) forwards;}
@keyframes pop{to{transform:translateY(0) scale(1)}}
.card::before{content:"";position:absolute;top:-40%;left:-30%;width:160%;height:80%;
background:radial-gradient(circle,rgba(245,197,66,.18),transparent 60%);pointer-events:none;}
.win-tag{font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);font-weight:700;}
.win-title{font-family:var(--font-disp);font-weight:900;font-size:26px;margin:6px 0 4px;}
.prize-badge{margin:16px auto 8px;padding:16px 18px;border-radius:16px;
background:linear-gradient(180deg,rgba(200,16,46,.22),rgba(110,10,24,.38));
border:1px solid rgba(245,197,66,.3);}
.prize-badge .p-name{font-family:var(--font-disp);font-weight:800;font-size:21px;color:var(--gold-soft);line-height:1.2;}
.prize-badge .p-desc{margin-top:7px;font-size:13.5px;color:#D8CBE6;line-height:1.5;}
.form{margin-top:18px;display:flex;flex-direction:column;gap:10px;text-align:left;}
.form label{font-size:12px;color:#B9A7D0;margin-bottom:-4px;letter-spacing:.02em;}
.form input{width:100%;padding:14px 16px;border-radius:13px;font-size:15px;font-family:var(--font-body);
color:var(--cream);background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.14);outline:none;
transition:border .2s,background .2s;}
.form input::placeholder{color:#8f7ea8;}
.form input:focus{border-color:var(--gold);background:rgba(245,197,66,.06);}
.claim{margin-top:6px;border:none;cursor:pointer;padding:16px;border-radius:14px;
font-family:var(--font-body);font-weight:800;font-size:16px;letter-spacing:.03em;color:#3a2600;
background:linear-gradient(180deg,var(--gold-soft),var(--gold) 50%,var(--gold-deep));
box-shadow:0 8px 22px rgba(245,197,66,.35);transition:transform .15s;}
.claim:hover{transform:translateY(-1px)}
.fine{margin-top:12px;font-size:11.5px;color:#8f7ea8;line-height:1.5;}
.thanks{text-align:center;}
.thanks .big{font-family:var(--font-disp);font-weight:900;font-size:26px;color:var(--gold);}
.thanks p{margin-top:10px;font-size:14px;color:#D8CBE6;line-height:1.55;}
canvas.confetti{position:fixed;inset:0;z-index:25;pointer-events:none;display:none;}
.mute{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:14px;z-index:30;width:42px;height:42px;border-radius:50%;
border:1px solid rgba(245,197,66,.4);cursor:pointer;font-size:18px;line-height:1;
background:rgba(28,7,13,.7);backdrop-filter:blur(6px);color:#fff;
display:flex;align-items:center;justify-content:center;transition:transform .15s,border-color .2s;}
.mute:hover{transform:scale(1.08);border-color:var(--gold);}
.mute.off{opacity:.55;}
.x{position:absolute;top:12px;right:14px;z-index:3;width:34px;height:34px;border-radius:50%;
border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.05);cursor:pointer;
color:var(--cream);font-size:22px;line-height:1;display:flex;align-items:center;justify-content:center;
transition:background .2s,border-color .2s,transform .15s;}
.x:hover{background:rgba(200,16,46,.35);border-color:var(--gold);transform:rotate(90deg);}
@media (max-width:380px){
.btn{padding:15px 34px;font-size:15px;}
h1{font-size:28px;}
}
@media (prefers-color-scheme: light){
:root:not([data-theme="dark"]){ }
}
</style>
</head>
<body>
<button class="mute" id="mute" aria-label="Включить/выключить звук">🔊</button>

<div class="stage">
<span class="eyebrow">Только сегодня</span>
<h1>Крутите колесо —<br>и заберите <span class="hl">свой подарок</span></h1>
<p class="sub">Один оборот — гарантированный бонус. Выигрывает каждый.</p>
<div class="wheel-wrap">
<svg class="pointer" viewBox="0 0 44 52">
<defs>
<linearGradient id="pg" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#FCE79B"/><stop offset="1" stop-color="#C9971F"/>
</linearGradient>
</defs>
<path d="M22 50 L4 10 Q22 0 40 10 Z" fill="url(#pg)" stroke="#7a5b10" stroke-width="1.5"/>
<circle cx="22" cy="13" r="5" fill="#fff6d8"/>
</svg>
<div class="wheel" id="wheel"></div>
<div class="rim" id="rim"></div>
<div class="hub"><span>🎁</span></div>
</div>
<button class="btn" id="spin">Крутить колесо</button>
<div class="tries">Осталось попыток: <b id="tries">1</b></div>
</div>

<div class="overlay" id="overlay">
<div class="card" id="card"></div>
</div>
<canvas class="confetti" id="confetti"></canvas>

<script>
/* ---------- ПРИЗЫ ---------- */
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwr63_rDnECWS9iA3PMIxL5PL6JPVVEYTI3nIJMAswu33J11ADPupDVUtV8DEIowDBl/exec';
const PRIZES = [
{ l1:'−20%', l2:'на заказ', name:'Скидка −20%',
desc:'Скидка −20% на любую покупку. Действует 24 часа.', w:30, color:'#C8102E' },
{ l1:'Купон', l2:'на доставку', name:'Бесплатная доставка',
desc:'Бесплатная доставка вашего заказа. Действует 24 часа.', w:25, color:'#6E0A18' },
{ l1:'Картридж', l2:'в подарок', name:'Картридж в подарок',
desc:'Один картридж в подарок. Действует 24 часа.', w:6, color:'#C8102E' },
{ l1:'Заливка', l2:'бесплатно', name:'Бесплатная заливка картриджа',
desc:'Бесплатная заливка полного картриджа жидкостью Chaser Grape Mint. Действует 24 часа.', w:20, color:'#6E0A18' },
{ l1:'−50%', l2:'на Elf Bar', name:'Скидка −50% на Elf Bar',
desc:'Скидка −50% на одноразки Elf Bar. Действует 24 часа.', w:15, color:'#C8102E' },
{ l1:'2+1', l2:'в подарок', name:'Акция 2+1',
desc:'При покупке 2 жидкостей — третья в подарок. Действует 24 часа.', w:1, color:'#6E0A18' },
{ l1:'Жидкость', l2:'в подарок', name:'Жидкость в подарок',
desc:'Одна жидкость полностью бесплатно — на ваш выбор вкуса. Действует 24 часа.', w:1, color:'#F5B301', jackpot:true },
];
const N = PRIZES.length, SEG = 360/N, R=250;
const wheel = document.getElementById('wheel');
function polar(a){ const r=(a-90)*Math.PI/180; return [R+240*Math.cos(r), R+240*Math.sin(r)]; }
let paths='', labels='';
PRIZES.forEach((p,i)=>{
const a0=i*SEG, a1=(i+1)*SEG;
const [x0,y0]=polar(a0), [x1,y1]=polar(a1);
paths+=`<path d="M${R} ${R} L${x0} ${y0} A240 240 0 0 1 ${x1} ${y1} Z" fill="${p.color}" stroke="#F5C542" stroke-width="2"/>`;
const mid=a0+SEG/2, flip=(mid>90&&mid<270);
const rot=flip?mid+180:mid, ty=flip?R+150:R-150;
const f1=p.jackpot?17:16;
labels+=`<g transform="rotate(${rot} ${R} ${R})">
<text x="${R}" y="${ty}" text-anchor="middle" font-family="Manrope,sans-serif"
fill="${p.jackpot?'#3a2600':'#FBF3E0'}" style="font-weight:800">
<tspan x="${R}" dy="-2" font-size="${f1}">${p.l1}</tspan>
<tspan x="${R}" dy="19" font-size="13" opacity=".9" style="font-weight:700">${p.l2}</tspan>
</text></g>`;
});
wheel.innerHTML=`<svg viewBox="0 0 500 500" style="width:100%;height:100%;border-radius:50%">
<circle cx="250" cy="250" r="248" fill="none" stroke="#C9971F" stroke-width="7"/>
${paths}${labels}</svg>`;
const rim=document.getElementById('rim');
for(let i=0;i<24;i++){
const b=document.createElement('div'); b.className='bulb';
const a=i/24*2*Math.PI;
b.style.left=`calc(50% + ${(Math.cos(a)*46).toFixed(2)}%)`;
b.style.top =`calc(50% + ${(Math.sin(a)*46).toFixed(2)}%)`;
b.style.animationDelay=(i%2?'.8s':'0s'); rim.appendChild(b);
}
for(let i=0;i<26;i++){
const s=document.createElement('div'); s.className='spark';
s.style.left=Math.random()*100+'vw'; s.style.top=Math.random()*100+'vh';
s.style.animationDelay=Math.random()*4+'s';
s.style.transform=`scale(${.6+Math.random()})`;
document.body.appendChild(s);
}
let spun=false, rotation=0;
const spinBtn=document.getElementById('spin');
const triesEl=document.getElementById('tries');
function pickWeighted(){
const total=PRIZES.reduce((s,p)=>s+p.w,0);
let r=Math.random()*total;
for(let i=0;i<N;i++){ r-=PRIZES[i].w; if(r<=0) return i; }
return N-1;
}
spinBtn.addEventListener('click',()=>{
if(spun) return; spun=true; spinBtn.disabled=true;
triesEl.textContent='0';
startAmbient();
const idx=pickWeighted();
const base=(360-(idx*SEG+SEG/2))%360;
const jitter=(Math.random()*2-1)*(SEG*0.34);
rotation = 360*7 + base + jitter;
whoosh(); scheduleTicks(rotation,5600);
wheel.style.transform=`rotate(${rotation}deg)`;
setTimeout(()=>{ chime(); showWin(idx); burst(); }, 5700);
});
let ac, ambientGain, ambientOn=false, muted=false;
function ctx(){ if(!ac) ac=new (window.AudioContext||window.webkitAudioContext)();
if(ac.state==='suspended') ac.resume(); return ac; }
function startAmbient(){
if(ambientOn) return; ambientOn=true;
const c=ctx();
ambientGain=c.createGain(); ambientGain.gain.value=muted?0:0.045;
ambientGain.connect(c.destination);
[174.6,220,277.2].forEach((f,i)=>{
const o=c.createOscillator(); o.type='sine'; o.frequency.value=f;
const lfo=c.createOscillator(), lg=c.createGain();
lfo.frequency.value=0.12+i*0.05; lg.gain.value=4+i;
lfo.connect(lg).connect(o.frequency); lfo.start();
const g=c.createGain(); g.gain.value=[0.6,0.4,0.3][i];
o.connect(g).connect(ambientGain); o.start();
});
sparkleLoop();
}
function sparkleLoop(){
if(!ambientOn) return;
if(!muted){ const c=ctx(),o=c.createOscillator(),g=c.createGain();
o.type='sine'; o.frequency.value=1200+Math.random()*800;
o.connect(g).connect(c.destination); const t=c.currentTime;
g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(0.03,t+0.02);
g.gain.exponentialRampToValueAtTime(0.0001,t+0.5); o.start(t); o.stop(t+0.5); }
setTimeout(sparkleLoop, 2600+Math.random()*2800);
}
function whoosh(){ if(muted)return; const c=ctx(),o=c.createOscillator(),g=c.createGain();
o.type='sawtooth'; o.frequency.setValueAtTime(120,c.currentTime);
o.frequency.exponentialRampToValueAtTime(520,c.currentTime+0.5);
g.gain.setValueAtTime(0.0001,c.currentTime);
g.gain.linearRampToValueAtTime(0.05,c.currentTime+0.06);
g.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+0.7);
o.connect(g).connect(c.destination); o.start(); o.stop(c.currentTime+0.7); }
function tickSound(p){ if(muted)return; const c=ctx(),o=c.createOscillator(),g=c.createGain();
o.type='square'; o.frequency.value=760+p*420;
o.connect(g).connect(c.destination); const t=c.currentTime;
g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(0.05,t+0.004);
g.gain.exponentialRampToValueAtTime(0.0001,t+0.05); o.start(t); o.stop(t+0.06); }
function scheduleTicks(totalDeg,dur){
const n=Math.floor(totalDeg/SEG);
for(let k=1;k<=n;k++){ const y=(k*SEG)/totalDeg; const t=1-Math.cbrt(1-Math.min(y,0.99999));
setTimeout(()=>tickSound(k/n), Math.max(0,t*dur)); }
}
function chime(){ if(muted)return; const c=ctx();
[523,659,784,1046,1318].forEach((f,i)=>{ const o=c.createOscillator(),g=c.createGain();
o.type='sine'; o.frequency.value=f; o.connect(g).connect(c.destination);
const t=c.currentTime+i*0.08; g.gain.setValueAtTime(0,t);
g.gain.linearRampToValueAtTime(0.2,t+0.03);
g.gain.exponentialRampToValueAtTime(0.0001,t+0.7); o.start(t); o.stop(t+0.7); });
const o=c.createOscillator(),g=c.createGain(); o.type='triangle'; o.frequency.value=196;
o.connect(g).connect(c.destination); const t=c.currentTime;
g.gain.setValueAtTime(0.0001,t);
g.gain.linearRampToValueAtTime(0.12,t+0.02);
g.gain.exponentialRampToValueAtTime(0.0001,t+1.1);
o.start(t); o.stop(t+1.1);
}
window.addEventListener('load', ()=>{ try{ startAmbient(); }catch(e){} });
window.addEventListener('pointerdown', ()=>{ try{ startAmbient(); ctx(); }catch(e){} }, {once:true});
const muteBtn=document.getElementById('mute');
muteBtn.addEventListener('click',(e)=>{ e.stopPropagation(); muted=!muted;
muteBtn.textContent=muted?'🔇':'🔊'; muteBtn.classList.toggle('off',muted);
if(ambientGain) ambientGain.gain.value=muted?0:0.045;
if(!ambientOn && !muted) startAmbient();
});
const overlay=document.getElementById('overlay'), card=document.getElementById('card');
function closeOverlay(){ overlay.classList.remove('on'); }
overlay.addEventListener('click', e=>{ if(e.target===overlay) closeOverlay(); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeOverlay(); });
function showWin(i){
const p=PRIZES[i];
card.innerHTML=`
<button class="x" id="x" aria-label="Закрыть">&times;</button>
<div class="win-tag">Поздравляем</div>
<div class="win-title">Ваш подарок!</div>
<div class="prize-badge">
<div class="p-name">${p.name}</div>
<div class="p-desc">${p.desc}</div>
</div>
<div class="form">
<label>Имя</label>
<input id="f-name" type="text" placeholder="Ваше имя" autocomplete="name">
<label>Телефон или Telegram</label>
<input id="f-contact" type="text" placeholder="+380 __ ___ __ __ или @username" autocomplete="tel">
<button class="claim" id="claim">Забрать подарок</button>
</div>
<div class="fine">Наш менеджер напишет вам в Telegram в течение часа, чтобы уточнить детали подарка.</div>`;
overlay.classList.add('on');
document.getElementById('x').addEventListener('click',closeOverlay);
document.getElementById('claim').addEventListener('click', async ()=>{
const nm=document.getElementById('f-name').value.trim();
const ct=document.getElementById('f-contact').value.trim();
if(!nm||!ct){
document.getElementById(nm?'f-contact':'f-name').style.borderColor='#ff6b6b'; return; }
const claimBtn=document.getElementById('claim');
claimBtn.disabled=true; claimBtn.textContent='Отправляем...';
try{
const res=await fetch(SCRIPT_URL,{
method:'POST',
headers:{'Content-Type':'text/plain;charset=utf-8'},
body:JSON.stringify({name:nm, phone:ct, prize:p.name})
});
const result=await res.json();
if(result.status==='duplicate'){
card.innerHTML=`<div class="thanks">
<div class="big">Вы уже участвовали</div>
<p>Этот номер телефона уже получал подарок ранее.<br>Один подарок — на один номер.</p>
</div>`;
return;
}
card.innerHTML=`<div class="thanks">
<div class="big">Готово, ${nm}!</div>
<p>Ваш подарок «${p.name}» уже летит к вам.<br>Проверьте Telegram через несколько минут.</p>
</div>`;
}catch(err){
card.innerHTML=`<div class="thanks">
<div class="big">Ошибка отправки</div>
<p>Не получилось отправить заявку. Проверьте интернет-соединение и попробуйте ещё раз.</p>
</div>`;
}
});
}
const cv=document.getElementById('confetti'), cx2=cv.getContext('2d');
let parts=[];
function burst(){
cv.style.display='block'; cv.width=innerWidth; cv.height=innerHeight;
const cols=['#F5C542','#FCE79B','#C8102E','#8E0C1C','#FBF3E0','#C9971F'];
parts=[];
for(let i=0;i<160;i++)parts.push({x:innerWidth/2,y:innerHeight*.35,
vx:(Math.random()-.5)*14,vy:Math.random()*-14-4,g:.32,
s:5+Math.random()*7,r:Math.random()*6,vr:(Math.random()-.5)*.4,
c:cols[i%cols.length],life:1});
requestAnimationFrame(loop);
}
function loop(){
cx2.clearRect(0,0,cv.width,cv.height); let alive=false;
parts.forEach(p=>{
p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.life-=.006;
if(p.life>0&&p.y<cv.height+30){alive=true;
cx2.save();cx2.translate(p.x,p.y);cx2.rotate(p.r);cx2.globalAlpha=Math.max(p.life,0);
cx2.fillStyle=p.c;cx2.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);cx2.restore();}
});
if(alive)requestAnimationFrame(loop); else cv.style.display='none';
}
addEventListener('resize',()=>{cv.width=innerWidth;cv.height=innerHeight;});
</script>
